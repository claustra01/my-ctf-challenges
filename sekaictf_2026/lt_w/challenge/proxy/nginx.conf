error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # client_ip logic is not a part of the challenge.
  # its just how GCP's external ALB appends "<client-ip>, <lb-vip>"
  map $http_x_forwarded_for $client_ip {
    default                                   $remote_addr;
    "~(?<xff_client>[^,\s]+),\s*[^,\s]+\s*$"  $xff_client;
  }

  log_format chal '$client_ip - - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
  access_log /dev/stdout chal;

  limit_req_zone $client_ip zone=create_zone:10m rate=10r/m;
  limit_req_status 429;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  upstream app {
    server 127.0.0.1:8080;
    keepalive 32;
  }

  server {
    listen 8081;
    keepalive_timeout 5s;

    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline';" always;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;

    location ^~ /create {
      proxy_pass http://app;
      limit_req zone=create_zone burst=2 nodelay;
    }

    location / {
      proxy_pass http://app;
    }
  }
}
